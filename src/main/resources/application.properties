# Serve static resources (like index.html, assets) from the static folder
spring.web.resources.static-locations=classpath:/static/

# Application identity
spring.application.name=Toros_Pickleball

# Ensure non-API requests (e.g., React routes) are forwarded to index.html
spring.mvc.view.prefix=/static/
spring.mvc.view.suffix=.html

# File upload limits
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- DataSource & JPA (externalized with sensible defaults) ---
# --- DataSource & JPA (PostgreSQL) ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/torosdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- Server settings ---
server.port=${SERVER_PORT:8080}
server.compression.enabled=${SERVER_COMPRESSION_ENABLED:false}

# --- JWT Secret (if used elsewhere) ---
jwt.secret=${JWT_SECRET:2fe1b220364d49031121580472e6ce648c3878a1b06374d923af230545205cdc}

# --- Logging ---
logging.level.com.example.Toros=${LOG_TOROS:DEBUG}
logging.level.org.springframework.web=${LOG_SPRING_WEB:DEBUG}
logging.level.org.hibernate.SQL=${LOG_HIBERNATE_SQL:DEBUG}
server.tomcat.accesslog.enabled=${ACCESS_LOG_ENABLED:true}
management.health.redis.enabled=${HEALTH_REDIS:false}

# --- Spring Security: OAuth2 Resource Server with Auth0 ---
spring.security.oauth2.resourceserver.jwt.issuer-uri=${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:https://dev-h27mq30rguvedtnf.us.auth0.com/}
spring.security.oauth2.resourceserver.jwt.audience=${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_AUDIENCES:https://Toros/api}
