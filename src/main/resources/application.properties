# Serve static resources (like index.html, assets) from the static folder
spring.web.resources.static-locations=classpath:/static/

spring.application.name=pickleball-tournament

# Ensure non-API requests (e.g., React routes) are forwarded to index.html
spring.mvc.view.prefix=/static/
spring.mvc.view.suffix=.html

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

logging.level.org.springframework.web=DEBUG
logging.level.org.springframework=DEBUG


# Set the server port if needed (default is 8080)
server.port=8080
