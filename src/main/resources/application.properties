# Serve static resources (like index.html, assets) from the static folder
spring.web.resources.static-locations=classpath:/static/

# Application identity
spring.application.name=Toros_Pickleball

# Ensure non-API requests (e.g., React routes) are forwarded to index.html
spring.mvc.view.prefix=/static/
spring.mvc.view.suffix=.html

# File upload limits
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- DataSource & JPA (externalized with sensible defaults) ---
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:testdb}
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}

# Active profile
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# --- Azure MongoDB (externalized) ---
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://taufeeq26:hKY6dYmAUGgESYzcykI21Dem5CC963vEg0bzPol6sBu1gyREr2KszEra2k7yhCdFIX6pr9ygtYwJACDbaLpMiA==@taufeeq26.mongo.cosmos.azure.com:10255/?ssl=true&replicaSet=globaldb&retrywrites=false&maxIdleTimeMS=120000&appName=@taufeeq26@}
spring.data.mongodb.database=${SPRING_DATA_MONGODB_DATABASE:torosdb}

# --- Server settings ---
server.port=${SERVER_PORT:8080}
server.compression.enabled=${SERVER_COMPRESSION_ENABLED:false}

# --- JWT Secret (if used elsewhere) ---
jwt.secret=${JWT_SECRET:2fe1b220364d49031121580472e6ce648c3878a1b06374d923af230545205cdc}

# --- Logging ---
logging.level.com.example.Toros=${LOG_TOROS:DEBUG}
logging.level.org.springframework.web=${LOG_SPRING_WEB:DEBUG}
logging.level.org.hibernate.SQL=${LOG_HIBERNATE_SQL:DEBUG}
server.tomcat.accesslog.enabled=${ACCESS_LOG_ENABLED:true}
management.health.redis.enabled=${HEALTH_REDIS:false}

